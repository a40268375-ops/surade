<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <linearGradient id="bibitBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#15803d"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>
    <linearGradient id="leafGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#facc15"/>
      <stop offset="50%" stop-color="#84cc16"/>
      <stop offset="100%" stop-color="#22c55e"/>
    </linearGradient>
  </defs>
  <rect width="200" height="200" rx="36" fill="url(#bibitBg)"/>
  <!-- Gold circular ring -->
  <circle cx="100" cy="100" r="86" fill="none" stroke="#facc15" stroke-width="3" stroke-dasharray="8 4" opacity="0.6"/>
  <!-- Sprout & Banana Leaf Icon Artwork -->
  <g transform="translate(100, 85)">
    <!-- Soil mound -->
    <path d="M -50 40 Q 0 25 50 40 Q 0 52 -50 40 Z" fill="#78350f" opacity="0.9"/>
    <!-- Main stem -->
    <path d="M 0 35 Q -3 5 0 -35" stroke="#fef08a" stroke-width="6" stroke-linecap="round" fill="none"/>
    <!-- Left Leaf (Big Banana Leaf) -->
    <path d="M 0 10 Q -42 0 -48 -24 C -45 -34, -20 -38, 0 -8 Z" fill="url(#leafGrad)"/>
    <!-- Right Leaf (Young Sprout) -->
    <path d="M 0 -8 Q 38 -15 42 -40 C 35 -48, 15 -42, 0 -24 Z" fill="url(#leafGrad)"/>
    <!-- Center bud -->
    <path d="M 0 -28 Q 0 -52 6 -56 Q 8 -45 0 -28 Z" fill="#facc15"/>
  </g>
  <!-- Brand text badge -->
  <rect x="24" y="146" width="152" height="34" rx="10" fill="#064e3b" stroke="#facc15" stroke-width="1.5"/>
  <text x="100" y="163" font-family="'Poppins', sans-serif" font-weight="900" font-size="12" fill="#facc15" text-anchor="middle" letter-spacing="1.5">KIOS BIBIT</text>
  <text x="100" y="174" font-family="'Poppins', sans-serif" font-weight="700" font-size="8" fill="#a7f3d0" text-anchor="middle" letter-spacing="1">KADEMANGAN</text>
</svg>
