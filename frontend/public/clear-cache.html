<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Clear Cache - Surade.com</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            background: linear-gradient(135deg, #059669 0%, #10B981 100%);
        }
        .container {
            background: white;
            padding: 3rem;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.2);
            text-align: center;
            max-width: 500px;
        }
        h1 {
            color: #059669;
            margin-bottom: 1rem;
            font-size: 2rem;
        }
        p {
            color: #64748b;
            margin-bottom: 2rem;
            line-height: 1.6;
        }
        button {
            background: linear-gradient(135deg, #059669, #10B981);
            color: white;
            border: none;
            padding: 1rem 2rem;
            font-size: 1rem;
            font-weight: 600;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.3s;
            box-shadow: 0 4px 15px rgba(5, 150, 105, 0.3);
        }
        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(5, 150, 105, 0.4);
        }
        .success {
            color: #059669;
            font-weight: 600;
            margin-top: 1rem;
            display: none;
        }
        .list {
            text-align: left;
            background: #f8fafc;
            padding: 1rem;
            border-radius: 8px;
            margin: 1rem 0;
            font-size: 0.9rem;
            color: #475569;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🧹 Clear Cache</h1>
        <p>Klik tombol di bawah untuk menghapus semua cache aplikasi dan memaksa reload data terbaru dari server.</p>
        
        <div class="list">
            Cache yang akan dihapus:
            <ul>
                <li>Navbar Categories</li>
                <li>Blog Categories</li>
                <li>Business Data</li>
                <li>User Session (optional)</li>
            </ul>
        </div>

        <button onclick="clearAllCache()">Clear Cache & Reload</button>
        <p class="success" id="success">✓ Cache berhasil dihapus! Halaman akan reload...</p>
    </div>

    <script>
        function clearAllCache() {
            // Clear localStorage cache
            localStorage.removeItem('cached_navbar_categories');
            localStorage.removeItem('cached_navbar_blog_categories');
            localStorage.removeItem('categories_public_v1');
            localStorage.removeItem('cached_businesses');
            
            // Show success message
            document.getElementById('success').style.display = 'block';
            
            // Redirect to home after 1.5 seconds
            setTimeout(() => {
                window.location.href = '/';
            }, 1500);
        }
    </script>
</body>
</html>
